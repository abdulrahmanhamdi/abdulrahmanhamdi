name: Update Stats Cards

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats-cards
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create assets folder
        run: mkdir -p assets

      # ---------- Stats card ----------
      - name: Stats card (dark)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=abdulrahmanhamdi&show_icons=true&theme=dark&hide_border=true&count_private=true&bg_color=0d1117&title_color=0EA5E9&text_color=c9d1d9&icon_color=0EA5E9
          path: assets/stats-dark.svg
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Stats card (light)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=abdulrahmanhamdi&show_icons=true&theme=default&hide_border=true&count_private=true&bg_color=f2f2f2&title_color=0EA5E9&text_color=212529&icon_color=0EA5E9
          path: assets/stats-light.svg
          token: ${{ secrets.METRICS_TOKEN }}

      # ---------- Top languages card ----------
      - name: Languages card (dark)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=abdulrahmanhamdi&layout=compact&theme=dark&hide_border=true&bg_color=0d1117&title_color=0EA5E9&text_color=c9d1d9
          path: assets/langs-dark.svg
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Languages card (light)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=abdulrahmanhamdi&layout=compact&theme=default&hide_border=true&bg_color=f2f2f2&title_color=0EA5E9&text_color=212529
          path: assets/langs-light.svg
          token: ${{ secrets.METRICS_TOKEN }}

      # ---------- Streak card ----------
      # Downloaded in the runner and saved into the repo. If the service is down,
      # the previous file stays untouched.
      - name: Streak cards
        run: |
          fetch() {
            if curl -fsSL --retry 3 --retry-delay 5 "$1" -o tmp.svg && grep -q "<svg" tmp.svg; then
              mv tmp.svg "$2"
            else
              echo "Skipped $2 (service unavailable), keeping previous version"
              rm -f tmp.svg
            fi
          }
          fetch "https://streak-stats.demolab.com?user=abdulrahmanhamdi&theme=dark&hide_border=true&background=0d1117&stroke=30363d&ring=0EA5E9&fire=0EA5E9&currStreakLabel=0EA5E9&currStreakNum=c9d1d9&sideNums=c9d1d9&sideLabels=8b949e&dates=8b949e" assets/streak-dark.svg
          fetch "https://streak-stats.demolab.com?user=abdulrahmanhamdi&theme=default&hide_border=true&background=f2f2f2&stroke=dee2e6&ring=0EA5E9&fire=0EA5E9&currStreakLabel=0EA5E9&currStreakNum=212529&sideNums=212529&sideLabels=6c757d&dates=6c757d" assets/streak-light.svg

      # Pull any commit pushed while this job was running, so the push never gets rejected
      - name: Sync with latest main
        run: git pull --rebase --autostash origin main

      - name: Commit updated cards
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update stats cards [skip ci]"
          file_pattern: assets/*.svg
