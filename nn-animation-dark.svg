<svg width="950" height="200" viewBox="0 0 950 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1D" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Left label: input meaning -->
  <text x="15" y="94" fill="#c9d1d9" font-size="16" font-family="monospace" font-weight="bold">Eng Abdulrahman</text>
  <text x="15" y="114" fill="#c9d1d9" font-size="16" font-family="monospace" font-weight="bold">Hamdi</text>

  <!-- Input Layer -->
  <circle cx="200" cy="50" r="8" fill="#0EA5E9" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="100" r="8" fill="#0EA5E9" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="150" r="8" fill="#0EA5E9" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Hidden Layer 1 -->
  <circle cx="350" cy="30" r="8" fill="#0EA5E9" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="80" r="8" fill="#0EA5E9" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="130" r="8" fill="#0EA5E9" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="170" r="8" fill="#0EA5E9" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Hidden Layer 2 -->
  <circle cx="500" cy="50" r="8" fill="#0EA5E9" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="100" r="8" fill="#0EA5E9" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="150" r="8" fill="#0EA5E9" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Output Layer -->
  <circle cx="650" cy="75" r="10" fill="#0284c7" opacity="0.9">
    <animate attributeName="r" values="10;12;10" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="125" r="10" fill="#0284c7" opacity="0.9">
    <animate attributeName="r" values="10;12;10" dur="2.3s" repeatCount="indefinite"/>
  </circle>

  <!-- Right label: output meaning -->
  <text x="675" y="94" fill="#c9d1d9" font-size="16" font-family="monospace" font-weight="bold">Vision</text>
  <text x="675" y="114" fill="#c9d1d9" font-size="16" font-family="monospace" font-weight="bold">Engineer</text>

  <!-- Connections: Input -> Hidden 1 -->
  <line x1="208" y1="50" x2="342" y2="30" stroke="url(#grad1D)" stroke-width="1" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
  </line>
  <line x1="208" y1="50" x2="342" y2="80" stroke="url(#grad1D)" stroke-width="1" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.5s" repeatCount="indefinite"/>
  </line>
  <line x1="208" y1="100" x2="342" y2="80" stroke="url(#grad1D)" stroke-width="1" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="1.8s" repeatCount="indefinite"/>
  </line>
  <line x1="208" y1="100" x2="342" y2="130" stroke="url(#grad1D)" stroke-width="1" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.2s" repeatCount="indefinite"/>
  </line>
  <line x1="208" y1="150" x2="342" y2="130" stroke="url(#grad1D)" stroke-width="1" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.7s" repeatCount="indefinite"/>
  </line>
  <line x1="208" y1="150" x2="342" y2="170" stroke="url(#grad1D)" stroke-width="1" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="1.5s" repeatCount="indefinite"/>
  </line>

  <!-- Hidden 1 -> Hidden 2 -->
  <line x1="358" y1="30" x2="492" y2="50" stroke="url(#grad1D)" stroke-width="1" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.1s" repeatCount="indefinite"/>
  </line>
  <line x1="358" y1="80" x2="492" y2="50" stroke="url(#grad1D)" stroke-width="1" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="1.9s" repeatCount="indefinite"/>
  </line>
  <line x1="358" y1="130" x2="492" y2="100" stroke="url(#grad1D)" stroke-width="1" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.3s" repeatCount="indefinite"/>
  </line>
  <line x1="358" y1="170" x2="492" y2="150" stroke="url(#grad1D)" stroke-width="1" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.6s" repeatCount="indefinite"/>
  </line>

  <!-- Hidden 2 -> Output -->
  <line x1="508" y1="50" x2="640" y2="75" stroke="url(#grad1D)" stroke-width="1.5" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </line>
  <line x1="508" y1="100" x2="640" y2="75" stroke="url(#grad1D)" stroke-width="1.5" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/>
  </line>
  <line x1="508" y1="100" x2="640" y2="125" stroke="url(#grad1D)" stroke-width="1.5" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/>
  </line>
  <line x1="508" y1="150" x2="640" y2="125" stroke="url(#grad1D)" stroke-width="1.5" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
  </line>

  <!-- Layer captions -->
  <text x="200" y="190" text-anchor="middle" fill="#8b949e" font-size="12" font-family="monospace">Input</text>
  <text x="350" y="190" text-anchor="middle" fill="#8b949e" font-size="12" font-family="monospace">Hidden</text>
  <text x="500" y="190" text-anchor="middle" fill="#8b949e" font-size="12" font-family="monospace">Hidden</text>
  <text x="650" y="190" text-anchor="middle" fill="#8b949e" font-size="12" font-family="monospace">Output</text>
</svg>
